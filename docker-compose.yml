services:
  app:
    build: .
    container_name: mt-license-app
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      APP_NAME: "MT License Manager"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mt_license
      DB_USERNAME: mt_user
      DB_PASSWORD: mt_password
      SESSION_DRIVER: file
      CACHE_STORE: file
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage

  db:
    image: mysql:8.0
    container_name: mt-license-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mt_license
      MYSQL_USER: mt_user
      MYSQL_PASSWORD: mt_password
      MYSQL_ROOT_PASSWORD: root_password
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mt_user", "-pmt_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  app_storage:
